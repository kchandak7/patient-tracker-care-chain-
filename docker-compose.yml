services:
  mongodb:
    image: mongo:7.0
    container_name: medcare-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - medcare-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medcare-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CLIENT_URL=http://localhost:5173
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    networks:
      - medcare-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000/api
    container_name: medcare-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - medcare-network

volumes:
  mongo_data:

networks:
  medcare-network:
    driver: bridge
